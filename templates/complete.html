<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflection Complete — WHY</title>

<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/style.css') }}"
/>

<script src="https://kit.fontawesome.com/07fec7b20f.js" crossorigin="anonymous"></script>

  </head>

  <body>
    <main class="page page-complete">
      <p class="eyebrow">Reflection complete</p>

  <div class="complete-mark">
    <i class="fa-solid fa-check"></i>
  </div>

  <h1 class="brand">You figured something out.</h1>

  <p class="complete-message">
    You took a moment to understand what happened instead of just moving
    on.
  </p>

  <div class="complete-divider"></div>

  <section class="project-credits">
    <p class="credits-label">A capstone project by</p>

    <p class="credits-names">
      Agraj Kc<br />
      Pranab Dong Lama<br />
      Biraj Nakarmi
    </p>

    <p class="credits-school">
      BCS · September Intake<br />
      IIMS College<br />
      2026
    </p>
  </section>

  <div class="complete-actions">
    <a class="start-btn" href="{{ url_for('entries') }}">
      Enter Memory Book
      <i class="fa-solid fa-arrow-right"></i>
    </a>

    <a class="home-link" href="{{ url_for('debug') }}">
      <i class="fa-solid fa-plus"></i>
      Start another reflection
    </a>

    <a class="home-link" href="{{ url_for('home') }}">
      <i class="fa-solid fa-arrow-left"></i>
      Back to Home
    </a>
  </div>
</main>

  </body>
</html>
