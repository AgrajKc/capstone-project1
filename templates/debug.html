
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug — WHY</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <main class="page page-debug">
      <div class="debug-header">
        <p class="eyebrow">A conversation with yourself</p>
        <p class="quiet-progress">{{ step }} / {{ total }}</p>
      </div>

      <h1 class="brand">WHY</h1>

      <form method="post" class="debug-form">
        <div class="question-block">
          <p class="question-number">Question {{ step }}</p>
          <label for="answer">{{ question.prompt }}</label>
          <p class="question-hint">{{ question.placeholder }}</p>
        </div>

        <textarea
          id="answer"
          name="answer"
          rows="7"
          placeholder="Start writing..."
          autofocus
        >{{ answer }}</textarea>

        {% if error %}
        <p class="note note-error">{{ error }}</p>
        {% endif %}

        <div class="form-nav">
          {% if step > 1 %}
          <button type="submit" class="back-link" name="direction" value="back">
            ← Previous
          </button>
          {% endif %}

          <button type="submit" class="start-btn" name="direction" value="next">
            {% if is_last %}Finish reflection{% else %}Keep going →{% endif %}
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
